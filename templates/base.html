<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Tax Automation Suite{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #0e4d3b, #082e24);
            color: white;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .sidebar .brand {
            padding: 24px 20px;
            font-size: 17px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            text-decoration: none;
            color: #ffffff;
        }

        .sidebar .group-label {
            padding: 16px 20px 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8fbcab;
        }

        .sidebar a.nav-item {
            display: block;
            padding: 11px 20px;
            color: #cfe3da;
            text-decoration: none;
            font-size: 14px;
        }

        .sidebar a.nav-item:hover {
            background: #15573f;
            color: white;
        }

        .sidebar a.nav-item.active {
            background: #1b6a50;
            color: white;
            border-left: 3px solid #ff9800;
        }

        .content {
            flex: 1;
            margin-left: 220px;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-dark {
            background: #222;
            color: white;
        }

        .btn-danger {
            background: #f5f5f5;
            color: #b00;
            border: 1px solid #dbb;
        }

        .btn-light {
            background: #eee;
            border: 1px solid #ccc;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }

        .flash {
            padding: 10px 12px;
            margin: 5px 0;
            border-radius: 5px;
            font-size: 14px;
        }

        .flash.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .flash.error {
            background: #fdecea;
            color: #b71c1c;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>

<div class="layout">

    <nav class="sidebar">
        <a class="brand" href="/">Tax Automation Suite</a>

        <div class="group-label">Features</div>

        <a class="nav-item {% if active == 'manage' %}active{% endif %}"
           href="/manage">
            Manage Credentials
        </a>

        <div class="group-label">Tools</div>

        {% for item in TOOLS.values() %}

        <a class="nav-item {% if active == item.key %}active{% endif %}"
           href="/tool/{{ item.key }}">
            {{ item.name }}
        </a>

        {% endfor %}
    </nav>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

</div>

</body>

</html>
